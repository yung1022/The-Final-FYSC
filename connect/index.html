<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Connect</title>
    <style>
      :root {
        --bg: #08131d;
        --panel: #101f2e;
        --panel-border: #1e3348;
        --text: #edf7ff;
        --muted: #a7c0d9;
        --accent: #5fd4ff;
        --success: #8fe6b4;
        --danger: #ff8b7d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, Arial, sans-serif;
      }
      .panel {
        width: min(92vw, 760px);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 24px 60px rgba(0,0,0,.35);
      }
      h1 { margin: 0 0 12px; font-size: clamp(24px, 4vw, 38px); }
      p { margin: 0; color: var(--muted); line-height: 1.5; }
      #status {
        margin-top: 14px;
        color: var(--muted);
        font-size: 12px;
      }
      .button-row {
        margin-top: 20px;
      }
      .button {
        display: inline-block;
        text-decoration: none;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), #4a82ff);
        color: #03141f;
        font-size: 16px;
        font-weight: 800;
        padding: 12px 18px;
        cursor: pointer;
      }
      .result {
        display: none;
        margin-top: 20px;
        padding: 16px;
        border-radius: 12px;
        border: 1px solid var(--panel-border);
        background: rgba(255,255,255,.02);
      }
      .result.visible { display: block; }
      .success { color: var(--success); }
      .error { color: var(--danger); }
      .code {
        display: inline-block;
        margin-top: 8px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(95,212,255,.12);
        border: 1px solid rgba(95,212,255,.35);
        font-weight: 700;
        word-break: break-all;
      }
      .small { font-size: 12px; color: var(--muted); margin-top: 8px; }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>YouTube Connect</h1>
      <p>Connect your Discord account first, then generate a connect code. Nightbot later submits the YouTube channel ID.</p>

      <div id="status"></div>

      <div class="button-row">
        <button id="discord-button" class="button" type="button">Connect Discord</button>
      </div>

      <div id="result" class="result" aria-live="polite"></div>
    </main>

    <script>
      const discordButton = document.getElementById('discord-button');
      const result = document.getElementById('result');
      const status = document.getElementById('status');

      const params = new URLSearchParams(window.location.search);
      const connected = params.get('connected') === '1';
      const discordUserId = params.get('discordUserId');
      const discordUsername = params.get('discordUsername');

      function updateUI() {
        if (connected && discordUserId) {
          status.textContent = `Discord connected: ${discordUsername || 'Unknown'} (${discordUserId})`;
          discordButton.textContent = 'Generate connect code';
          return;
        }

        status.textContent = 'Not connected to Discord yet.';
        discordButton.textContent = 'Connect Discord';
      }

      updateUI();

      discordButton.addEventListener('click', async () => {
        if (!connected || !discordUserId) {
          window.location.href = '/api/discord/login';
          return;
        }

        try {
          result.classList.add('visible');
          result.innerHTML = '<div class="success">Generating connect code…</div>';

          const response = await fetch('/api/connect/generate', {
            method: 'POST',
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || 'Failed to generate connect code');
          }

          result.innerHTML = `
            <div class="success"><strong>Connect code created.</strong></div>
            <div><strong>Command:</strong></div>
            <div class="code">!connect ${data.connectId}</div>
            <div class="small">Nightbot later calls: <strong>/api/connect/${data.connectId}?channel=YOUTUBE_CHANNEL_ID</strong></div>
          `;
        } catch (error) {
          result.classList.add('visible');
          result.innerHTML = `<div class="error">${error.message}</div>`;
        }
      });
    </script>
  </body>
</html>
