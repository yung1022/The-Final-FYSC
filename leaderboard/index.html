<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Top 50 Leaderboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="leaderboard-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">FYSC LIVE RANKINGS</p>
          <h1>Discord FYSC - Season 4 - Top 50 Leaderboard | Read pinned comment for instructions</h1>
        </div>
        <div class="header-tools">
          <div id="battle-panel" class="battle-panel" aria-label="Channel battle comparison">
            <span class="music-label">BATTLE</span>
            <div id="battle-content" class="battle-content">Waiting for channels…</div>
          </div>
          <div id="growth-panel" class="growth-panel" aria-label="Top three fastest growing players">
            <span class="music-label">FASTEST GROWING</span>
            <div id="growth-list" class="growth-list"></div>
          </div>
          <iframe
            class="hidden-ncs-player"
            title="NoCopyrightSounds playlist"
            src="https://www.youtube.com/embed?listType=playlist&list=PL1rcvJR5LYrrz1XiNaDN&autoplay=1&loop=1&controls=0&rel=0"
            allow="autoplay; encrypted-media"
            aria-hidden="true"></iframe>
        </div>
      </header>
      <div id="grid" class="grid"></div>
      <div id="error" class="error" hidden></div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/odometer.js/0.4.8/odometer.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
