<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Top 50 Leaderboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="leaderboard-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">FYSC LIVE RANKINGS</p>
          <h1>Top 50 Leaderboard</h1>
        </div>
        <div class="music-panel">
          <span class="music-label">NCS RADIO</span>
          <iframe
            title="NoCopyrightSounds music playlist"
            src="https://www.youtube.com/embed?listType=user_uploads&list=NoCopyrightSounds"
            loading="lazy"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen></iframe>
        </div>
      </header>
      <div id="grid" class="grid"></div>
      <div id="error" class="error" hidden></div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
